name: Build

on:
  push:
    branches: [ "**" ]
    # Fork 的开发发布候选只接受 dev-vX.Y.Z tag；精确格式由 job 内校验。
    tags: [ "dev-v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    # 主仓库保留原有的分支/手动构建；fork 仅允许明确的开发 tag，避免
    # 任意分支 push 消耗完整跨平台矩阵。Release workflow 仍仅主仓库可用。
    if: >-
      (github.repository == 'AimerSo/AimerWT' && github.ref_type != 'tag') ||
      (github.repository == 'He0xD4C0/AimerWT' &&
       github.ref_type == 'tag' &&
       startsWith(github.ref_name, 'dev-v'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows amd64
          - os: windows-latest
            arch: amd64
            python-arch: x64
          # 暂不发布 Windows arm64：pythonnet/clr-loader 仅提供 x86/x64 NetFX 加载器
          # Linux amd64
          - os: ubuntu-latest
            arch: amd64
            python-arch: x64
          # Linux arm64
          - os: ubuntu-24.04-arm
            arch: arm64
            python-arch: arm64
          # macOS amd64 (Intel)
          - os: macos-15-intel
            arch: amd64
            python-arch: x64
          # macOS arm64 (Apple Silicon)
          - os: macos-15
            arch: arm64
            python-arch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Validate fork development tag
      if: github.repository == 'He0xD4C0/AimerWT'
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! "$GITHUB_REF_NAME" =~ ^dev-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Fork CI requires a tag in dev-vX.Y.Z form; got: $GITHUB_REF_NAME"
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: ${{ matrix.python-arch }}

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build bundled macOS vgmstream runtime
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        runtime_dir="$RUNNER_TEMP/aimerwt-vgmstream-runtime"
        python scripts/build_macos_vgmstream_runtime.py \
          --work-dir "$RUNNER_TEMP/aimerwt-vgmstream-build" \
          --output-dir "$runtime_dir" \
          --arch "${{ matrix.arch }}" \
          --install-dependencies
        echo "AIMERWT_MACOS_VGMSTREAM_RUNTIME=$runtime_dir" >> "$GITHUB_ENV"

    - name: Build
      env:
        PYTHONIOENCODING: utf-8
        # 只允许 fork 的 dev-vX.Y.Z tag 生成不含遥测配置的验收包；
        # 主仓库空 Secrets 仍会由 build.py 拒绝。
        AIMERWT_ALLOW_MISSING_BUILD_SECRETS: ${{ github.repository == 'He0xD4C0/AimerWT' && '1' || '' }}
        REPORT_URL: ${{ secrets.REPORT_URL }}
        TELEMETRY_CLIENT_SECRET: ${{ secrets.TELEMETRY_CLIENT_SECRET }}
        TELEMETRY_SALT: ${{ secrets.TELEMETRY_SALT }}
      run: |
        python scripts/build.py

    - name: Prepare release assets
      run: >-
        python scripts/prepare_release_assets.py
        --platform "${{ runner.os }}"
        --arch "${{ matrix.arch }}"
        --output-dir release-assets

    - name: Smoke test Windows executable
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $executables = @(Get-ChildItem -LiteralPath release-assets -Filter '*.exe' -File)
        if ($executables.Count -ne 1) {
          throw "Expected exactly one Windows executable, found $($executables.Count)."
        }
        $stdoutPath = Join-Path $env:RUNNER_TEMP "aimerwt-self-test.stdout.log"
        $stderrPath = Join-Path $env:RUNNER_TEMP "aimerwt-self-test.stderr.log"
        $process = Start-Process `
          -FilePath $executables[0].FullName `
          -ArgumentList @('--self-test') `
          -WindowStyle Hidden `
          -Wait `
          -PassThru `
          -RedirectStandardOutput $stdoutPath `
          -RedirectStandardError $stderrPath
        $exitCode = $process.ExitCode
        $logPaths = @(
          $stdoutPath,
          $stderrPath,
          (Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Aimer_WT\logs\app.log'),
          (Join-Path $env:TEMP 'WT_Voice_Manager_logs\app.log')
        ) | Select-Object -Unique
        foreach ($logPath in $logPaths) {
          if (Test-Path -LiteralPath $logPath -PathType Leaf) {
            Write-Host "===== $logPath ====="
            Get-Content -LiteralPath $logPath
          }
        }
        if ($null -eq $exitCode) {
          throw "Windows executable self-test did not return an exit code."
        }
        if ($exitCode -ne 0) {
          throw "Windows executable self-test failed with exit code $exitCode."
        }

    - name: Smoke test macOS app bundle
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        APP_PATH="$(ls -d dist/*.app | head -n 1)"
        if [ -z "$APP_PATH" ]; then
          echo "No macOS .app bundle was produced"
          exit 1
        fi
        BUNDLE_EXECUTABLE="$APP_PATH/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
        /usr/bin/codesign --verify --all-architectures --deep --strict "$APP_PATH"
        "$BUNDLE_EXECUTABLE" --self-test
        python scripts/verify_macos_vgmstream_bundle.py \
          --app "$APP_PATH" \
          --arch "${{ matrix.arch }}"
        echo "macOS self-test passed: $BUNDLE_EXECUTABLE"

    - name: Verify macOS release archive
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        archive="release-assets/AimerWT_V3.1_Beta_macOS_${{ matrix.arch }}.zip"
        if [ ! -s "$archive" ]; then
          echo "Missing macOS release archive: $archive"
          exit 1
        fi
        unpack_dir="$RUNNER_TEMP/aimerwt-release-${{ matrix.arch }}"
        mkdir -p "$unpack_dir"
        ditto -x -k "$archive" "$unpack_dir"
        app_count="$(find "$unpack_dir" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
        if [ "$app_count" != "1" ]; then
          echo "Expected one .app after release archive extraction, found $app_count"
          find "$unpack_dir" -maxdepth 2 -print
          exit 1
        fi
        APP_PATH="$(find "$unpack_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
        python scripts/verify_macos_vgmstream_bundle.py \
          --app "$APP_PATH" \
          --arch "${{ matrix.arch }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.arch }}
        path: release-assets/*
        if-no-files-found: error
